<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brand-studio intro</title>
<!--
  Intro: a gradient logo reveal. Colours, gradient stops, logo artwork and the
  brand face all arrive in the brand-variables block injected by build_video.py.
  No network reference, no CSS animation - the frame is positioned entirely from
  the ?t=<0..1> query parameter so each rendered frame is deterministic.
-->
{{BRAND_VARS}}
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: var(--canvas-w); height: var(--canvas-h);
    overflow: hidden; background: var(--surface-dark);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  #stage {
    position: relative;
    width: var(--canvas-w); height: var(--canvas-h);
    padding: var(--safe-y) var(--safe-x);
    /* Field form, not the corner-to-corner ramp: the border stays on one brand
       colour so the frame reads as a single field and nothing hugs the edge. */
    background: var(--grad-field);
    color: var(--ink-on-dark);
    font-family: var(--font-regular), var(--font-fallback);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* A mint sweep that crosses the frame behind the lockup, inside the safe area. */
  #sweep {
    position: absolute; left: var(--safe-x); right: var(--safe-x); top: 50%;
    height: 2px; background: var(--accent); opacity: .35;
    transform-origin: left center;
  }
  #corner {
    position: absolute; right: var(--safe-x); bottom: var(--safe-y);
    width: 180px; height: 10px; background: var(--accent);
    transform-origin: right center;
  }

  #lockup {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; max-width: 1500px;
  }
  #mask { overflow: hidden; }
  #logo {
    height: 132px; width: calc(132px * var(--logo-reversed-aspect, 4.85));
    background-image: var(--logo-reversed);
    background-size: contain; background-repeat: no-repeat; background-position: center;
  }
  #rule { height: 6px; width: 260px; background: var(--accent); margin-top: 46px; }
  #eyebrow {
    font-family: var(--font-medium), var(--font-fallback);
    font-size: 24px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); margin-top: 42px;
  }
  #title {
    font-family: var(--font-semibold), var(--font-fallback);
    font-size: 54px; line-height: 1.18; letter-spacing: -.015em;
    margin-top: 26px; max-width: 1400px;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="sweep"></div>
    <div id="corner"></div>
    <div id="lockup">
      <div id="mask"><div id="logo"></div></div>
      <div id="rule"></div>
      <div id="eyebrow"></div>
      <div id="title"></div>
    </div>
  </div>

<script>
window.__SCENE__ = {{SCENE_DATA}};
(function () {
  "use strict";

  var D = window.__SCENE__ || {};

  function queryT() {
    var match = /[?&]t=([^&]*)/.exec(String(window.location.search || ""));
    var value = match ? parseFloat(decodeURIComponent(match[1])) : NaN;
    if (!isFinite(value)) { return 1; }
    return Math.max(0, Math.min(1, value));
  }
  var T = queryT();

  function clamp(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function phase(start, span) { return easeOut(clamp((T - start) / span)); }

  var eyebrow = document.getElementById("eyebrow");
  var title = document.getElementById("title");
  var rule = document.getElementById("rule");

  if (D.eyebrow) { eyebrow.textContent = String(D.eyebrow); }
  else { eyebrow.style.display = "none"; }

  if (D.title) { title.textContent = String(D.title); }
  else { title.style.display = "none"; }

  // A block's own scrollHeight is not a usable overflow signal: Poppins
  // ink-overflows a tight line-height, so only the stage is measured.
  function baseSize(node) {
    var recorded = node.getAttribute("data-base-size");
    if (recorded === null) {
      recorded = String(parseFloat(window.getComputedStyle(node).fontSize) || 0);
      node.setAttribute("data-base-size", recorded);
    }
    return parseFloat(recorded);
  }

  function fit(node, minPx) {
    if (!node || node.style.display === "none") { return; }
    var stage = document.getElementById("stage");
    var size = baseSize(node);
    node.style.fontSize = size + "px";
    var guard = 0;
    while (size > minPx && guard < 60) {
      if (stage.scrollHeight <= stage.clientHeight + 6 &&
          node.scrollWidth <= node.clientWidth + 2) { break; }
      size -= 2;
      node.style.fontSize = size + "px";
      guard += 1;
    }
  }

  function render() {
    fit(title, 30);

    // 0.00-0.48  logo rises, scales and fades in behind a clipping mask
    var pLogo = phase(0.0, 0.48);
    var mask = document.getElementById("mask");
    var logo = document.getElementById("logo");
    var full = logo.offsetHeight || 132;
    mask.style.height = Math.max(1, full * pLogo).toFixed(2) + "px";
    logo.style.opacity = pLogo.toFixed(4);
    logo.style.transform = "scale(" + (0.94 + 0.06 * pLogo).toFixed(4) + ")";
    logo.style.transformOrigin = "center bottom";

    // 0.28-0.66  mint rule grows from the centre
    var pRule = phase(0.28, 0.38);
    rule.style.transform = "scaleX(" + pRule.toFixed(4) + ")";

    // 0.20-0.90  the sweep crosses the frame
    var pSweep = phase(0.18, 0.72);
    document.getElementById("sweep").style.transform = "scaleX(" + pSweep.toFixed(4) + ")";

    // 0.42-0.84  eyebrow then title
    var pEyebrow = phase(0.42, 0.36);
    eyebrow.style.opacity = pEyebrow.toFixed(4);
    eyebrow.style.transform = "translateY(" + ((1 - pEyebrow) * 22).toFixed(2) + "px)";

    var pTitle = phase(0.52, 0.38);
    title.style.opacity = pTitle.toFixed(4);
    title.style.transform = "translateY(" + ((1 - pTitle) * 28).toFixed(2) + "px)";

    var pCorner = phase(0.6, 0.34);
    document.getElementById("corner").style.transform = "scaleX(" + pCorner.toFixed(4) + ")";
  }

  render();
  window.addEventListener("load", render);
}());
</script>
</body>
</html>
